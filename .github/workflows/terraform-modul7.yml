name: terraform-modul7

on:
  pull_request:
    branches: [main]
    paths:
      - 'modul7/**'
      - '.github/workflows/terraform-modul7.yml'
  push:
    branches: [main]
    paths:
      - 'modul7/**'
      - '.github/workflows/terraform-modul7.yml'

permissions:
  id-token: write        # OIDC mot Azure (modul 6)
  contents: read
  pull-requests: write   # for å poste plan tilbake i PR-en

concurrency:
  group: terraform-modul7-${{ github.ref }}
  cancel-in-progress: false      # en avbrutt apply etterlater en hengende state-lås

defaults:
  run:
    working-directory: modul7    # her bor Terraform-rota

env:
  ARM_USE_OIDC:        "true"
  ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  build:                       # kvalitetsporten – kjører alltid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false     # ingen state, ingen Azure-pålogging
      - run: terraform validate

  plan:                        # på pull request – forhåndsvisning, ingen endring
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev           # også her – ellers matcher ikke sub-claimet (modul 6)
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/login@v3.1.0
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=modul7/dev/network.tfstate"
      - run: terraform plan -var-file="dev.tfvars" -no-color

  apply-dev:                   # ved merge til main
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/login@v3.1.0
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=modul7/dev/network.tfstate"
      - run: terraform apply -auto-approve -var-file="dev.tfvars"

  apply-prod:                  # etter dev – venter på godkjenning
    needs: apply-dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod          # required reviewers settes på dette miljøet
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/login@v3.1.0
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config=backend.hcl -backend-config="key=modul7/prod/network.tfstate"
      - run: terraform apply -auto-approve -var-file="prod.tfvars"
