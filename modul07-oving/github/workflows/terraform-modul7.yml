  .github/workflows/terraform-modul7.yml  –  LEVERINGSARBEIDSFLYTEN
# -----------------------------------------------------------------------------
#  Fire jobber, én fil, to hendelser.
#
#    pull_request  →  build  →  plan          (lesing: ingenting endres)
#    push til main →  build  →  apply-dev  →  apply-prod   (skriving)
#
#  Det er de to if-linjene lenger nede som holder hendelsene fra hverandre.
#  Alt annet – koden, backenden, identiteten – er nøyaktig det samme. Én
#  forhåndsvisning og én utrulling er den samme operasjonen, kjørt med og uten
#  lov til å skrive.
#
#  Pipelinen leverer ÉN mappe: modul7/. Tre steder i fila peker dit – paths:
#  (hva som utløser kjøringen), working-directory (hvor kommandoene kjøres)
#  og key (hvor staten skrives). Peker de tre ikke samme vei, feiler
#  ingenting; du leverer bare et annet sted enn du tror.
#
#  Ingenting i denne fila er en hemmelighet. Les den gjerne som om den lå
#  åpent på nett, for det gjør den sannsynligvis.
# =============================================================================
 
name: terraform-modul7
 
on:
  # To hendelser, og bare to. Merk at pull_request-kjøringen skjer på en
  # SAMMENSLÅTT versjon av grenen din og main – altså på det resultatet en
  # merge faktisk ville gitt, ikke på grenen alene.
  #
  # paths: avgrenser begge hendelsene til den mappa denne pipelinen leverer.
  # En endring i modul5-ovelse/ eller i README.md er ikke dens ansvar, og
  # skal ikke gjøre den rød. Filteret henger på hendelsen, ikke på
  # workflowen – derfor må det gjentas under begge.
  #
  # Den andre linja i hver liste peker på FILA SELV, og den er ikke pynt:
  # uten den utløser en endring i bare YAML-en ingen kjøring i det hele
  # tatt. GitHub sier ikke fra – du får ingen rød kjøring, du får ingen
  # kjøring.
  pull_request:
    branches: [main]
    paths:
      - 'modul7/**'
      - '.github/workflows/terraform-modul7.yml'
  push:
    branches: [main]
    paths:
      - 'modul7/**'
      - '.github/workflows/terraform-modul7.yml'
 
# -----------------------------------------------------------------------------
#  Én kjøring av gangen per gren
# -----------------------------------------------------------------------------
#  To apply-jobber som kjører samtidig mot den samme state-bloben, ender med
#  at den andre får "Error acquiring the state lock". Låsen gjør jobben sin,
#  men en rød kjøring er en dårlig måte å oppdage det på.
#
#  cancel-in-progress MÅ stå på false her. Det er fristende å skru den på for
#  å spare tid – men en terraform apply som drepes midt i, etterlater en
#  hengende lås og en state som ikke lenger stemmer med virkeligheten.
#  Ressursene finnes; regnskapet vet det ikke.
#
#  Mappenavnet står i gruppa med vilje. Låsen sitter på ÉN blob –
#  modul7/dev/network.tfstate – og uten navnet ville modul 8-pipelinen
#  stått i kø bak modul 7 uten å ha noe til felles med den. Køen skal
#  følge staten, ikke repoet.
concurrency:
  group: terraform-modul7-${{ github.ref }}
  cancel-in-progress: false
 
# -----------------------------------------------------------------------------
#  Rettighetene til GITHUB_TOKEN – eksplisitt, og ikke mer enn nødvendig
# -----------------------------------------------------------------------------
permissions:
  # Retten til å BE om et OIDC-token. Uten denne linja finnes det ikke noe
  # token å bytte inn hos Entra, og azure/login feiler før den har snakket
  # med Azure i det hele tatt. (Øving 6, Del D.)
  id-token: write
 
  # Nok til å sjekke ut koden. Ingen av jobbene her skriver til repoet.
  contents: read
 
  # Kun for plan-jobben, som legger planen som en kommentar i pull requesten.
  # Fjerner du det steget, kan denne linja også fjernes.
  pull-requests: write
 
# -----------------------------------------------------------------------------
#  HVOR kommandoene kjøres
# -----------------------------------------------------------------------------
#  Repoet har flere Terraform-rotmoduler: backend/ fra øving 6, modul7/ her,
#  modul8/ senere. Terraform bryr seg bare om mappa den står i, så jobben må
#  stå i den riktige. På workflow-nivå gjelder denne linja alle fire jobbene,
#  og det er grunnen til at backend.hcl, dev.tfvars og ./modules/network kan
#  stå som rene relative stier lenger nede – akkurat som når du står i mappa
#  selv.
#
#  Merk at defaults bare treffer run:-steg, ikke uses:-steg.
#  actions/checkout@v4 sjekker fortsatt ut HELE repoet, og det skal den –
#  .gitignore ligger på rota, og en annen modulmappe kan komme til senere.
defaults:
  run:
    working-directory: modul7
 
# -----------------------------------------------------------------------------
#  Miljøvariabler for HELE workflowen
# -----------------------------------------------------------------------------
#  azurerm-provideren og azurerm-backenden leser disse selv. Det er derfor
#  ingen av terraform-stegene under trenger å sende med en eneste
#  legitimasjon: de finner den i miljøet.
env:
  # "Bruk OIDC" – ikke en kontonøkkel, ikke en client secret.
  ARM_USE_OIDC: "true"
 
  # Tre IDer, og ingen fjerde verdi. De ligger som VARIABLES i GitHub, ikke
  # som secrets: identifikatorer gir ingen tilgang alene. Bonusen er at de
  # ikke maskeres i loggen, så den dagen innloggingen feiler, ser du faktisk
  # hvilken ID som var feil i stedet for ***.
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
  # Demper "husk å kjøre terraform apply"-hintene i utskriften. Rent kosmetisk,
  # men gjør kjøreloggen lettere å lese.
  TF_IN_AUTOMATION: "true"
 
jobs:
  # ===========================================================================
  #  1. build – kvalitetsporten
  # ===========================================================================
  #  Den eneste jobben som IKKE logger inn i Azure, og den eneste som kjører
  #  på begge hendelsene. Det er ikke tilfeldig: alt som kan sjekkes uten
  #  tilgang til et miljø, bør sjekkes uten tilgang til et miljø. Da kan
  #  ingenting gå galt i selve sjekken.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: hashicorp/setup-terraform@v3
 
      # -recursive er det som gjør flagget verdt noe: uten det sjekkes bare
      # modul7/ selv, og modul7/modules/network/ går under radaren.
      #
      # Rekkevidden går fra modul7/ og nedover, ikke fra repo-rota. En
      # slurvete linje i modul5-ovelse/ kan derfor ikke gjøre denne
      # kjøringen rød: porten dekker stacken den leverer, ikke hele repoet.
      - name: Formatering
        run: terraform fmt -check -recursive
 
      # -backend=false er hele grunnen til at denne jobben kan kjøre uten å
      # logge inn. validate trenger at providerne er lastet ned, ikke tilgang
      # til state. Uten flagget ville init forsøkt å koble seg til
      # storage-kontoen – og jobben stoppet på noe som ikke har med
      # kodekvalitet å gjøre.
      - name: Init uten backend
        run: terraform init -backend=false
 
      - name: Validering
        run: terraform validate
 
  # ===========================================================================
  #  2. plan – forhåndsvisning på pull request
  # ===========================================================================
  plan:
    # Kjører aldri hvis kvalitetsporten er rød. Rekkefølgen er hele poenget
    # med en port.
    needs: build
 
    # LESINGEN. Denne jobben finnes bare på pull_request.
    if: github.event_name == 'pull_request'
 
    runs-on: ubuntu-latest
 
    # DENNE LINJA ER IKKE EN UTRULLING – DEN ER EN IDENTITET.
    #
    # GitHub skriver subjectet (sub) i OIDC-tokenet ut fra hvordan jobben er
    # satt opp:
    #
    #   med environment: dev   →  repo:<org>/<repo>:environment:dev
    #   uten environment:      →  repo:<org>/<repo>:pull_request
    #
    # De tre fødererte credentialene fra øving 6 er environment-baserte.
    # Fjernes linja, sender GitHub den nederste formen, og Entra avviser
    # byttet med AADSTS70021 – selv på en helt ufarlig plan.
    environment: dev
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: Azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - uses: hashicorp/setup-terraform@v3
 
      # Nøyaktig den samme kommandoen du kjørte for hånd i øving 6: de fire
      # faste verdiene fra backend.hcl, og key hektet på ved siden av.
      #
      # Legg merke til at det IKKE står -reconfigure her. Lokalt trengte du
      # flagget hver gang du byttet key, fordi Terraform husket forrige
      # backend i .terraform/. En runner har ingen .terraform/ når den
      # starter – den har ingenting å glemme.
      #
      # key bærer mappenavnet. I øving 6 het den bare dev/network.tfstate,
      # fordi det fantes én kodebase. Nå ligger modul7/ og modul8/ i samme
      # repo, og to rotmoduler som peker på samme blob er ikke to miljøer –
      # det er to kodebaser som overskriver hverandres regnskap.
      #
      # backend.hcl oppgis uten mappenavn: working-directory har alt satt
      # oss i modul7/.
      - name: Init mot dev-staten
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=modul7/dev/network.tfstate"
 
      # id: plan gjør utskriften tilgjengelig for steget under.
      # -no-color fordi ANSI-koder er uleselige både i loggen og i en
      # PR-kommentar.
      - name: Plan
        id: plan
        run: terraform plan -var-file="dev.tfvars" -no-color
 
      # Valgfritt, men det er dette pull-requests: write er til for.
      # Poenget er ikke bekvemmelighet: en kollega som skal godkjenne en
      # endring, bør se hva den gjør uten å måtte klikke seg inn i en
      # kjørelogg.
      - name: Legg planen som kommentar i PR-en
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const body = `#### terraform plan – \`dev\`
            <details><summary>Vis planen</summary>
 
            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
 
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
 
  # ===========================================================================
  #  3. apply-dev – utrulling ved merge
  # ===========================================================================
  apply-dev:
    needs: build
 
    # SKRIVINGEN. Speilbildet av if-linja i plan-jobben. Sammen sørger de to
    # for at en pull request aldri endrer noe, og at en merge alltid gjør det.
    if: github.event_name == 'push'
 
    runs-on: ubuntu-latest
 
    # Samme miljø som plan – altså samme credential, og samme rettigheter.
    # dev har ingen required reviewers: her skal det gå av seg selv.
    environment: dev
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: Azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - uses: hashicorp/setup-terraform@v3
 
      - name: Init mot dev-staten
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=modul7/dev/network.tfstate"
 
      # -auto-approve er trygt her nettopp fordi porten står foran: koden er
      # gjennomgått i en pull request, og planen er lest av et menneske. Det
      # ville ikke vært trygt i en workflow som kjørte på hver push til hvilken
      # som helst gren.
      - name: Apply
        run: terraform apply -auto-approve -var-file="dev.tfvars"
 
  # ===========================================================================
  #  4. apply-prod – utrulling bak en godkjenningsport
  # ===========================================================================
  #  Jobben er en kopi av apply-dev med tre ord byttet ut: dev → prod i
  #  environment, i key og i -var-file. At det er hele forskjellen mellom to
  #  miljøer, er poenget med modul 6 sagt på nytt – nå i en pipeline.
  apply-prod:
    # Prod rulles aldri ut før dev har gått grønt. Rekkefølgen er billig
    # forsikring: feiler endringen, feiler den i dev.
    needs: apply-dev
 
    if: github.event_name == 'push'
 
    runs-on: ubuntu-latest
 
    # HER GJØR NAVNET DOBBELT ARBEID.
    #
    #  1. Det bestemmer OIDC-subjectet, som i de to jobbene over.
    #  2. Det bærer beskyttelsesreglene i GitHub. Er "Required reviewers" satt
    #     på miljøet prod, stopper kjøringen her og venter på at et menneske
    #     trykker "Review deployments".
    #
    # Porten står altså IKKE i koden. Den står i repoinnstillingene, og
    # jobben peker bare på den. Det er derfor apply-dev og apply-prod kan
    # være identiske og likevel oppføre seg helt ulikt.
    environment: prod
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: Azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - uses: hashicorp/setup-terraform@v3
 
      - name: Init mot prod-staten
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=modul7/prod/network.tfstate"
 
      - name: Apply
        run: terraform apply -auto-approve -var-file="prod.tfvars"
 
# =============================================================================
#  Det som IKKE står i denne fila
# =============================================================================
#  Det finnes ingen destroy-jobb. Pipelinen kan bygge, men den river ikke.
#
#  Det er et bevisst valg, ikke en forglemmelse: en destroy som utløses av en
#  merge er en av de svært få tingene som kan slette produksjon ved et uhell.
#  Opprydding gjøres for hånd, fra en maskin, av noen som vet hva de gjør.
#
#  Det finnes heller ingen client secret, ingen storage-kontonøkkel og ingen
#  tfvars-fil med hemmeligheter i. Alt pipelinen trenger for å bevise hvem den
#  er, utstedes under kjøring og lever i noen minutter.
# ===========================================